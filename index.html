<style>
[hidden]{display:none!important}
:root{
  --bg:#f4f2ee; --surface:#ffffff; --surface2:#f8f7f4; --text:#22201c; --muted:#7a756c;
  --line:#e4e0d8; --done-bg:#e3f4e6; --done-text:#3d7a4a; --on-done:#ffffff; --accent:#2f6fde;
  --danger:#c8402f; --warn:#d9891a; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181b; --surface:#222428; --surface2:#1c1e21; --text:#ecebe8; --muted:#9a978f;
    --line:#33363b; --done-bg:#1f3a27; --done-text:#8fd19e; --on-done:#12301b; --accent:#6c9cf0;
    --danger:#ef6b5a; --warn:#f0a845; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#17181b; --surface:#222428; --surface2:#1c1e21; --text:#ecebe8; --muted:#9a978f;
  --line:#33363b; --done-bg:#1f3a27; --done-text:#8fd19e; --on-done:#12301b; --accent:#6c9cf0;
  --danger:#ef6b5a; --warn:#f0a845; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-weight:700;font-size:17px;margin-right:auto}
.stat{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.stat b{font-size:15px}
.tbtn{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.tbtn:hover{border-color:var(--muted)}
.saved{font-size:12px;color:var(--muted);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

.overdue-stat:hover{border-color:var(--danger)}
.overdue-stat.has-overdue b{color:var(--danger)}
.overdue-list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.overdue-item{width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;background:var(--surface2);padding:10px 12px}
.overdue-item:hover{border-color:var(--danger)}
.overdue-item strong{display:block;overflow-wrap:anywhere;font-weight:600}
.overdue-item small{display:block;color:var(--muted);margin-top:4px}
.overdue-item time{color:var(--danger)}
/* focus strip */
.focus{padding:10px 16px 0}
.focus-inner{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow)}
.focus h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.focus ul{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.focus li{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}
.focus .empty{color:var(--muted);font-size:13px}

/* board */
.board{display:grid;align-items:start;gap:14px;padding:14px 16px 24px;grid-template-columns:repeat(auto-fill,minmax(var(--colw,260px),1fr))}
.board.striped{overflow-x:auto}
.col.strip{background:var(--c);color:var(--on-c);align-self:stretch;min-height:360px;align-items:center;padding:8px 0;gap:8px;position:relative;cursor:pointer;border:none;overflow:hidden}
.col.strip:hover{filter:brightness(1.08)}
.col.strip .grip{position:relative;z-index:3}
.strip-title{flex:1;min-height:0;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.strip-count{font-size:11px;font-weight:700;background:rgba(0,0,0,.18);border-radius:999px;padding:2px 5px}
.strip-bar{width:6px;height:56px;background:rgba(0,0,0,.22);border-radius:3px;display:flex;align-items:flex-end;overflow:hidden;flex:0 0 auto}
.strip-bar i{display:block;width:100%;background:var(--on-c);opacity:.85}
.col.strip.complete{box-shadow:0 0 0 3px var(--done-text)}
.col.strip.complete .strip-count::before{content:"✓ "}
.strip-drop{position:absolute;inset:0;margin:0;padding:0;min-height:0;z-index:2;list-style:none}
.strip-drop > *{display:none!important}
.col.strip:has(.sortable-ghost){outline:3px dashed var(--text);outline-offset:-3px}
.col{min-width:0;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;border:1px solid var(--line);transition:box-shadow .4s}
.collapse{transition:transform .2s;font-size:13px;padding:2px 4px}
.col.collapsed .collapse{transform:rotate(-90deg)}
.col.collapsed .tasks,.col.collapsed .add,.col.collapsed .archive-btn{display:none}
.col.collapsed .progress{border-radius:0 0 var(--radius) var(--radius)}
.col-head{background:var(--c);color:var(--on-c);border-radius:var(--radius) var(--radius) 0 0;padding:8px 10px 6px;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.grip{cursor:grab;opacity:.7;font-size:16px;line-height:1;padding:2px;touch-action:none;user-select:none}
.col-title{font-weight:650;font-size:15px;line-height:1.4;outline:none;border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:3px 6px;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal;hyphens:none}
.col-title:focus{background:rgba(255,255,255,.25);text-overflow:clip}
.col-controls{display:flex;align-items:center;gap:5px;min-width:0}
.col-controls .count{margin-left:auto}
.col-controls .grip{padding:4px}
.col-due{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:650;border-radius:999px;padding:2px 6px;white-space:nowrap;background:#fff3ca;color:#694600}
.col-due.late{background:#ffe0dd;color:#942c20}
.count{font-size:12px;font-weight:600;background:rgba(0,0,0,.15);border-radius:999px;padding:2px 8px;white-space:nowrap}
.icon{background:none;border:none;border-radius:6px;padding:2px 6px;font-size:18px;line-height:1;color:inherit}
.icon:hover{background:rgba(0,0,0,.12)}
.progress{height:6px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--c);filter:saturate(1.2);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.col.complete{box-shadow:0 0 0 3px var(--done-text),var(--shadow)}
.col.complete .col-controls::after{content:"✓";font-weight:800;margin-left:2px}
.tasks{list-style:none;margin:0;padding:8px;flex:1;min-height:40px}
.task{display:flex;align-items:flex-start;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;transition:background .4s,border-color .4s}
.task.done{background:var(--done-bg);border-color:transparent}
.task.just{animation:flash .7s ease}
@keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.03)}100%{transform:scale(1)}}
.chk{position:relative;flex:0 0 auto;width:22px;height:22px;margin-top:1px}
.chk input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.box{display:block;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;transition:all .2s;pointer-events:none}
.chk input:checked + .box{background:var(--done-text);border-color:var(--done-text)}
.chk input:checked + .box::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.task.just .box{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.body{flex:1;min-width:0;cursor:pointer}
.txt{word-break:break-word;display:inline;background:linear-gradient(currentColor,currentColor) 0 55%/0% 1.5px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.task.done .txt{background-size:100% 1.5px;color:var(--done-text)}
.task.done.just .txt{animation:strike .45s ease forwards}
@keyframes strike{from{background-size:0% 1.5px}to{background-size:100% 1.5px}}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.badge{border-radius:999px;padding:1px 7px;background:var(--surface);border:1px solid var(--line)}
.badge.overdue{color:#fff;background:var(--danger);border-color:var(--danger)}
.badge.soon{color:#fff;background:var(--warn);border-color:var(--warn)}
.prio{width:9px;height:9px;border-radius:50%;display:inline-block;margin-top:6px;flex:0 0 auto}
.prio.high{background:var(--danger)}.prio.mid{background:var(--warn)}.prio.low{background:transparent}
.star{background:none;border:none;font-size:16px;line-height:1;padding:2px;color:var(--muted);opacity:.5}
.star.on{color:#e8b100;opacity:1}
.add{padding:0 8px 8px}
.add input{width:100%;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:8px}
.add input:focus{outline:none;border-color:var(--accent);border-style:solid;background:var(--surface2)}
.archive-btn{margin:0 8px 10px;border:none;border-radius:8px;padding:9px;background:var(--done-text);color:var(--on-done);font-weight:600;animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tbtn.addcol{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tbtn.addcol.full{opacity:.55}
.stat.wip.ok b{color:var(--done-text)} .stat.wip.warn b{color:var(--warn)} .stat.wip.over{border-color:var(--danger)} .stat.wip.over b{color:var(--danger)}
.stat.wip.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface2);border:none;padding:6px 10px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* dialog */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.on{display:flex}
.dialog{background:var(--surface);border-radius:14px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dialog h2{margin:0 0 12px;font-size:17px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--text);font-size:15px}
.field textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.spacer{flex:1}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;background:var(--s)}
.sw.sel{border-color:var(--text)}

/* archive drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--surface);box-shadow:-6px 0 30px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .3s;z-index:40;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:17px;flex:1}
.drawer .list{overflow:auto;padding:12px 16px;flex:1}
.arc{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.arc summary{cursor:pointer;font-weight:600}
.arc small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.arc ul{margin:8px 0;padding-left:18px;font-size:14px}
.arc li.d{text-decoration:line-through;color:var(--done-text)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:transform .3s;z-index:60;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:none;color:var(--accent);font-weight:700}

.confetti{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:70;animation:fly 1.3s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){
  .topbar{padding:8px 12px}.board{padding:12px;gap:10px}.focus{padding:8px 12px 0}
  .brand{width:100%}
}
</style>

<body>
<nav style="padding:8px 16px;font-size:13px"><a href="https://ugurlab.github.io/desk-and-bench/" style="color:var(--accent)">← Desk &amp; Bench</a><span style="margin-left:14px">Local storage · Save JSON backups regularly / JSON yedeğini düzenli indir</span></nav>
<div class="topbar">

<script>
(function(){
const LS_KEY = 'desk-and-bench-task-board-v1';
const PALETTE = ['#4a7bd0','#2e9e8f','#5b9a3c','#d9a21b','#e07a2f','#d4524a','#c2457e','#8a5cc7','#5a6577','#8c6a4a'];

const I18N = {
  tr:{brand:"Görev Panosu",focusTitle:"Bugünün odağı",focusEmpty:"Bugüne son tarihi atanmış görevler burada otomatik görünür. ☆ ile de görev ekleyebilirsin (en fazla 6 açık görev).",day:"gün",layout:"Yerleşim",layoutWrap:"Izgara (sığmayan alta geçer)",layoutStrip:"Şerit (fazlası dikey şerit olur)",wipTitle:"Açık bölme / ekranın kapasitesi",wipFull:"Aynı anda en fazla {n} bölme açık olabilir. Bitirdiğin bir bölmeyi arşive taşıyarak yer aç.",maxFull:"Ekranda tam açık bölme sayısı",openStrip:"Açmak için tıkla",focusAutoOff:"Odakta zaten 6 açık görev var; bu görev odaktan çıkarıldı.",movedTo:"Görev taşındı:",density:"Görünüm",dNormal:"Normal",dCompact:"Sıkı",collapse:"Şeride çevir",
    week:"Bu hafta",streak:"Seri",days:"gün",archive:"Arşiv",addTask:"+ Görev ekle",addCol:"+ Bölme ekle",newCol:"Yeni bölme",

    confirmDelArc:"Bu arşiv kalıcı olarak silinsin mi?",archivedOn:"Arşivlendi",more:"Diğer",theme:"Tema",themeAuto:"Otomatik",
    themeLight:"Açık",themeDark:"Koyu",language:"Dil",exportJ:"Yedeği indir (JSON)",importJ:"Yedekten yükle",importOk:"Yedek yüklendi",
    importBad:"Dosya okunamadı",confirmImport:"Mevcut pano, yedekteki ile değiştirilsin mi?",saved:"Kaydedildi",close:"Kapat",
    overdue:"gecikti",today:"bugün",tomorrow:"yarın",noteIcon:"not",welcomeCol:"Başlarken",
    w1:"Bir görevi tamamlamak için kutuya dokun",w2:"Görevi düzenlemek için metnine dokun",w3:"☆ ile bugünün odağına ekle",
    w4:"Sütunu ⠿ tutamağından sürükle",w5:"⋯ ile bölmenin rengini değiştir",colMenu:"Bölme menüsü",allDone:"Harika! Bölme tamamlandı 🎉"},
  en:{brand:"Task Board",focusTitle:"Today's focus",focusEmpty:"Tasks due today appear here automatically. Use ☆ to pin tasks (up to 6 open tasks).",day:"day",layout:"Layout",layoutWrap:"Grid (wraps to next row)",layoutStrip:"Strips (extra sections fold into strips)",wipTitle:"Open sections / screen capacity",wipFull:"At most {n} sections can be open at once. Archive a finished section to make room.",maxFull:"Fully open sections on screen",openStrip:"Click to open",focusAutoOff:"Focus already has 6 open tasks; this one was removed from focus.",movedTo:"Task moved to:",density:"Density",dNormal:"Normal",dCompact:"Compact",collapse:"Fold into strip",
    week:"This week",streak:"Streak",days:"days",archive:"Archive",addTask:"+ Add task",addCol:"+ Add section",newCol:"New section",
    completeArchive:"Done · Move to archive",editTask:"Edit task",task:"Task",due:"Due date",priority:"Priority",
    pNone:"None",pMid:"Medium",pHigh:"High",note:"Note",save:"Save",cancel:"Cancel",del:"Delete",colSettings:"Section settings",
    color:"Color",custom:"Custom color",archiveCol:"Move to archive",deleteCol:"Delete section",confirmDelCol:"Delete this section and all its tasks?",
    deleted:"Deleted",undo:"Undo",archived:"Moved to archive",focusMax:"Focus holds at most 6 open tasks. Finish one to add another.",
    archiveEmpty:"Archive is empty. When every task in a section is done, you can move it here.",restore:"Restore",deletePerm:"Delete forever",
    confirmDelArc:"Delete this archived section forever?",archivedOn:"Archived",more:"More",theme:"Theme",themeAuto:"Auto",
    themeLight:"Light",themeDark:"Dark",language:"Language",exportJ:"Download backup (JSON)",importJ:"Load from backup",importOk:"Backup loaded",
    importBad:"Could not read file",confirmImport:"Replace the current board with the backup?",saved:"Saved",close:"Close",
    overdue:"overdue",today:"today",tomorrow:"tomorrow",noteIcon:"note",welcomeCol:"Getting started",
    w1:"Tap the box to complete a task",w2:"Tap a task's text to edit it",w3:"Use ☆ to add it to today's focus",
    w4:"Drag a section by its ⠿ handle",w5:"Use ⋯ to change a section's color",colMenu:"Section menu",allDone:"Great! Section complete 🎉"}
};

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const $ = (s,el=document) => el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function defaultState(){
  const L = I18N.en;
  return {version:2, lang:'en', theme:'auto', layout:'strip', maxFull:5, density:'normal', archive:[], log:[],
    columns:[{id:uid(), title:L.welcomeCol, color:PALETTE[0], tasks:['w1','w2','w3','w4','w5'].map(k=>newTask(L[k]))}]};
}
function newTask(text){ return {id:uid(), text, done:false, doneAt:null, due:'', note:'', priority:'', focus:false, createdAt:Date.now()}; }

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && Array.isArray(s.columns)) return normalize(s); }
  }catch(e){}
  return defaultState();
}
function normalize(s){
  s.archive = Array.isArray(s.archive)?s.archive:[];
  s.log = Array.isArray(s.log)?s.log:[];
  s.lang = s.lang==='en'?'en':'tr';
  s.theme = ['auto','light','dark'].includes(s.theme)?s.theme:'auto';
  if((s.version||1)<2){ s.layout='strip'; s.version=2; }
  s.layout = s.layout==='wrap'?'wrap':'strip';
  s.maxFull = 5;
  const okId = v => typeof v==='string' && /^[A-Za-z0-9_-]{1,40}$/.test(v);
  const num = v => (typeof v==='number' && isFinite(v)) ? v : 0;
  s.columns = s.columns.filter(c=>c && typeof c==='object'); s.archive = s.archive.filter(c=>c && typeof c==='object');
  s.log = s.log.filter(e=>e && typeof e==='object').map(e=>({t:num(e.t), id:String(e.id||'')}));
  [...s.columns, ...s.archive].forEach(c=>{
    c.id = okId(c.id) ? c.id : uid();
    c.color = (typeof c.color==='string' && /^#[0-9a-fA-F]{6}$/.test(c.color)) ? c.color : PALETTE[0];
    c.title = c.title==null ? '' : String(c.title);
    c.collapsed = !!c.collapsed; c.used = num(c.used);
    if(c.archivedAt!=null) c.archivedAt = num(c.archivedAt);
    c.tasks = Array.isArray(c.tasks) ? c.tasks.filter(x=>x && typeof x==='object') : [];
    c.tasks = c.tasks.map(x=>{ const y = Object.assign(newTask(''), x);
      y.id = okId(y.id) ? y.id : uid(); y.text = String(y.text==null?'':y.text); y.note = String(y.note==null?'':y.note);
      y.done = !!y.done; y.focus = !!y.focus; y.doneAt = y.doneAt ? num(y.doneAt) : null; y.createdAt = num(y.createdAt);
      y.due = (typeof y.due==='string' && /^\d{4}-\d{2}-\d{2}$/.test(y.due)) ? y.due : '';
      y.priority = ['mid','high'].includes(y.priority) ? y.priority : '';
      return y; });
  });
  return s;
}
let S = load();
let savedTimer;
function save(){

  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  const el = $('#saved'); el.textContent = t('saved'); el.classList.add('on');
  clearTimeout(savedTimer); savedTimer = setTimeout(()=>el.classList.remove('on'), 1200);
}
const t = k => (I18N[S.lang]||I18N.tr)[k] || k;

/* ---------- helpers ---------- */
function onColor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#fff';
  const n = parseInt(m[1],16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.62 ? '#1d1b18' : '#ffffff';
}
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function startOfWeek(){ const d=new Date(); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); }
function weekCount(){ const s=startOfWeek(); return S.log.filter(e=>e.t>=s).length; }
function streak(){
  const days = new Set(S.log.map(e=>dayKey(e.t)));
  const d = new Date(); d.setHours(12,0,0,0);
  if(!days.has(dayKey(d.getTime()))) d.setDate(d.getDate()-1);
  let n=0; while(days.has(dayKey(d.getTime()))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function dueInfo(task){
  if(!task.due) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const [y,m,d] = task.due.split('-').map(Number); const due = new Date(y,m-1,d);
  const diff = Math.round((due - today)/86400000);
  let label = due.toLocaleDateString(S.lang==='en'?'en-GB':'tr-TR',{day:'numeric',month:'short'});
  let cls = '';
  if(!task.done){
    if(diff<0){ cls='overdue'; label += ' · '+t('overdue'); }
    else if(diff===0){ cls='soon'; label = t('today'); }
    else if(diff===1){ cls='soon'; label = t('tomorrow'); }

  }
  return {label, cls};
}

function focusDate(now = new Date()){
 return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
}
function focusEntries(state, now = new Date()){
 const today=focusDate(now), entries=[];
 state.columns.forEach(c=>c.tasks.forEach(x=>{
  if(x.focus || (!x.done && x.due===today)) entries.push([x,c]);
 }));
 return entries.sort((a,b)=>Number(a[0].done)-Number(b[0].done)
   || Number(b[0].due===today)-Number(a[0].due===today));
}
function openFocusCount(exceptId){
 return focusEntries(S).filter(([x])=>!x.done && x.id!==exceptId).length;
}
function columnDueCounts(column, today = focusDate()){
 const counts={today:0,late:0};
 column.tasks.forEach(task=>{
  if(task.done || !/^\d{4}-\d{2}-\d{2}$/.test(task.due||''))return;
  if(task.due===today)counts.today++;
  else if(task.due<today)counts.late++;
 });
 return counts;
}

   +badge(counts.late,en?'Overdue':'Gecikmiş','!',true);
}
function overdueEntries(state, today=focusDate()){

const STRIP_W = 46, WIP_MAX = 10;
function capacity(){
  const board = $('#board'); const cs = getComputedStyle(board);
  const W = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if(W < 700) return WIP_MAX;
  const gap = parseFloat(cs.columnGap) || 14;
  const minFull = 260;
  const k = Math.min(3, S.maxFull);
  let n = WIP_MAX;
  while(n > k && !(k*minFull + (n-k)*STRIP_W + (n-1)*gap <= W)) n--;
  return n;
}
function wipFull(){
  const cap = capacity();
  if(S.columns.length >= cap){
    toast(t('wipFull').replace('{n}', cap));
    const w = $('#statWip'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
    return true;
  }
  return false;
}
function orderedColumns(columns, full = null){
  const isOpen = c => full ? full.has(c.id) : !c.collapsed;
  return [...columns.filter(isOpen), ...columns.filter(c=>!isOpen(c))];
}
function layoutPlan(board){
  const cs = getComputedStyle(board);
  const W = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if(W < 700) return null;               // phones / narrow windows: grid layout
  const gap = parseFloat(cs.columnGap) || 14;
  const n = S.columns.length; if(!n) return null;
  const minFull = 260;
  const cand = S.columns.map((c,i)=>({c,i})).filter(o=>!o.c.collapsed)
    .sort((a,b)=>(b.c.used||0)-(a.c.used||0) || b.i-a.i).map(o=>o.c);
  const fits = k => k*minFull + (n-k)*STRIP_W + (n-1)*gap <= W;
  let F = Math.min(S.maxFull, cand.length);
  while(F>1 && !fits(F)) F--;
  const full = new Set(cand.slice(0,F).map(c=>c.id));
  const avail = W - (n-F)*STRIP_W - (n-1)*gap;
  const denom = cand.length < S.maxFull ? S.maxFull : F;
  const colW = Math.max(minFull, Math.floor(avail / Math.max(1,denom)));
  const columns = orderedColumns(S.columns, full);
  const tmpl = columns.map(c=>full.has(c.id) ? colW+'px' : STRIP_W+'px').join(' ');
  return {full, tmpl, columns};
}
function bindSortable(){
  sortables.forEach(s=>s.destroy()); sortables=[];
  if(typeof Sortable==='undefined') return;
  const opts = {animation:180, delay:150, delayOnTouchOnly:true, ghostClass:'sortable-ghost', chosenClass:'sortable-chosen'};
  document.querySelectorAll('#board .tasks').forEach(ul=>{
    const strip = ul.classList.contains('strip-drop');
    sortables.push(Sortable.create(ul, Object.assign({}, opts, {group:{name:'tasks', pull:!strip, put:true}, sort:!strip, filter:'input,button', preventOnFilter:false, onEnd:syncFromDOM})));
  });
  sortables.push(Sortable.create($('#board'), Object.assign({}, opts, {handle:'.grip', draggable:'.col', onEnd:syncFromDOM})));
}
let movedMsg = null;
function syncFromDOM(){
  movedMsg = null;
  const all = {}; S.columns.forEach(c=>c.tasks.forEach(x=>all[x.id]=x));
  const cols = {}; S.columns.forEach(c=>cols[c.id]=c);
  const newCols = [];
  document.querySelectorAll('#board .col').forEach(sec=>{
    const c = cols[sec.dataset.id]; if(!c) return;
    const dom = [...sec.querySelectorAll('.tasks > .task')].map(li=>all[li.dataset.id]).filter(Boolean);
    if(sec.classList.contains('strip')){
      const added = dom.filter(x=>!c.tasks.includes(x));
      c.tasks = c.tasks.concat(added);
      if(added.length) movedMsg = t('movedTo')+' '+c.title;
    } else c.tasks = dom;
    newCols.push(c);
  });
  S.columns = newCols; save(); render();
  if(movedMsg) toast(movedMsg);
}

/* ---------- actions ---------- */
function toggleTask(id){
  const f = findTask(id); if(!f) return;
  const wasComplete = isComplete(f.col);
  f.task.done = !f.task.done; f.col.used = Date.now();
  let focusOff = false;
  if(f.task.done){ f.task.doneAt = Date.now(); S.log.push({t:Date.now(), id}); }
  else {
    f.task.doneAt = null; const i = S.log.map(e=>e.id).lastIndexOf(id); if(i>-1) S.log.splice(i,1);
    if(f.task.focus){
      const open = openFocusCount(f.task.id);
      if(open>=FOCUS_LIMIT && f.task.due!==focusDate()){ f.task.focus=false; focusOff=true; }
    }
  }
  if(S.log.length>5000) S.log = S.log.slice(-5000);
  justId = id; save(); render();
  if(!wasComplete && isComplete(f.col)){
    const head = document.querySelector(`.col[data-id="${f.col.id}"] .col-head`);
    if(head){ const r = head.getBoundingClientRect(); confetti(r.left + r.width/2, r.top + r.height/2, f.col.color); }
    toast(t('allDone'));
  }
  if(focusOff) toast(t('focusAutoOff'));
}
function toggleFocus(id){
  const f = findTask(id); if(!f) return;
  if(!f.task.focus){
    const n = openFocusCount(f.task.id);
    if(n>=FOCUS_LIMIT && !f.task.done && f.task.due!==focusDate()){ toast(t('focusMax')); return; }
  }
  f.task.focus = !f.task.focus; save(); render();
}
function addTask(colId, text){
  const c = S.columns.find(x=>x.id===colId); if(!c || !text.trim()) return;
  c.tasks.push(newTask(text.trim())); c.used = Date.now(); save(); render();
  const inp = document.querySelector(`.col[data-id="${colId}"] .add input`); if(inp) inp.focus();
}
function addColumn(){
  if(wipFull()) return;
  const used = new Set(S.columns.map(c=>c.color));
  const color = PALETTE.find(p=>!used.has(p)) || PALETTE[S.columns.length % PALETTE.length];
  const c = {id:uid(), title:t('newCol'), color, tasks:[], used:Date.now()};
  S.columns.push(c); save(); render();
  const el = document.querySelector(`.col[data-id="${c.id}"] .col-title`);
  if(el){ el.focus(); document.execCommand && document.execCommand('selectAll',false,null); el.scrollIntoView({behavior:'smooth',inline:'end',block:'nearest'}); }
}
function archiveColumn(id){
  const i = S.columns.findIndex(c=>c.id===id); if(i<0) return;
  const [c] = S.columns.splice(i,1);
  c.tasks.forEach(x=>x.focus=false);
  c.archivedAt = Date.now(); S.archive.unshift(c); save(); render(); toast(t('archived'));
}
let undoFn = null;
function deleteColumn(id){
  const i = S.columns.findIndex(c=>c.id===id); if(i<0) return;
  const [c] = S.columns.splice(i,1); save(); render();

function deleteTask(id){

    const done = c.tasks.filter(x=>x.done).length;
    const dt = new Date(c.archivedAt||Date.now()).toLocaleDateString(S.lang==='en'?'en-GB':'tr-TR',{day:'numeric',month:'long',year:'numeric'});
    return `<details class="arc" style="--c:${c.color}" data-id="${c.id}"><summary>${esc(c.title)}<small>${esc(t('archivedOn'))}: ${esc(dt)} · ${done}/${c.tasks.length}</small></summary>
      <ul>${c.tasks.map(x=>`<li class="${x.done?'d':''}">${esc(x.text)}</li>`).join('')}</ul>
      <div class="row"><button class="btn" data-restore="${c.id}">↩ ${esc(t('restore'))}</button><button class="btn danger" data-purge="${c.id}">${esc(t('deletePerm'))}</button></div></details>`;
  }).join('');
}
$('#archiveList').addEventListener('click', e=>{
  const r = e.target.closest('[data-restore]'), p = e.target.closest('[data-purge]');
  if(r){ const i=S.archive.findIndex(c=>c.id===r.dataset.restore); if(i>-1 && !wipFull()){ const [c]=S.archive.splice(i,1); delete c.archivedAt; S.columns.push(c); save(); render(); renderArchive(); } }
  if(p && confirm(t('confirmDelArc'))){ S.archive = S.archive.filter(c=>c.id!==p.dataset.purge); save(); render(); renderArchive(); }
});
$('#btnArchive').onclick = ()=>{ renderArchive(); $('#drawer').classList.add('on'); };
$('#closeDrawer').onclick = ()=>$('#drawer').classList.remove('on');
$('#btnMore').onclick = moreMenu;
$('#btnAddCol').onclick = addColumn;

/* ---------- toast & confetti ---------- */
let toastTimer;
function toast(msg, undo){
  $('#toastMsg').textContent = msg;
  const b = $('#toastBtn');
  if(undo){ b.style.display=''; b.textContent=t('undo'); b.onclick=()=>{ undo(); hide(); }; } else b.style.display='none';
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  const hide = ()=>$('#toast').classList.remove('on');
  toastTimer = setTimeout(hide, undo?5000:2200);
}
function confetti(x,y,base){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = [base,'#f2c94c','#6fcf97','#56ccf2','#eb5757','#bb6bd9'];
  for(let i=0;i<70;i++){
    const s = document.createElement('span'); s.className='confetti';
    const ang = Math.random()*Math.PI*2, dist = 80+Math.random()*180;
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.background=colors[i%colors.length];
    s.style.setProperty('--dx', Math.cos(ang)*dist+'px'); s.style.setProperty('--dy', (Math.sin(ang)*dist+120)+'px');
    s.style.setProperty('--r', (Math.random()*720-360)+'deg');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1400);
  }
}

/* ---------- events ---------- */
document.addEventListener('change', e=>{
  if(e.target.matches('.task .chk input')){ const li=e.target.closest('.task'); toggleTask(li.dataset.id); }
});
document.addEventListener('click', e=>{
  const star = e.target.closest('.star'); if(star){ toggleFocus(star.closest('.task').dataset.id); return; }
  const body = e.target.closest('.task .body'); if(body){ editTask(body.closest('.task').dataset.id); return; }
  const cm = e.target.closest('.col-menu'); if(cm){ columnMenu(cm.closest('.col').dataset.id); return; }
  const ab = e.target.closest('.archive-btn'); if(ab){ archiveColumn(ab.closest('.col').dataset.id); return; }
  const sp = e.target.closest('.col.strip'); if(sp && !e.target.closest('.grip')){ const c=S.columns.find(x=>x.id===sp.dataset.id); if(c){ c.collapsed=false; c.used=Date.now(); save(); render(); } return; }
  const cl = e.target.closest('.col .collapse'); if(cl){ const c=S.columns.find(x=>x.id===cl.closest('.col').dataset.id); if(c){ c.collapsed=!c.collapsed; save(); render(); } return; }
});
document.addEventListener('submit', e=>{
  if(e.target.matches('.col .add')){ e.preventDefault(); const inp=e.target.querySelector('input'); addTask(e.target.closest('.col').dataset.id, inp.value); }
});
document.addEventListener('focusout', e=>{
  if(e.target.matches('.col-title')){
    const c = S.columns.find(x=>x.id===e.target.closest('.col').dataset.id);
    const v = e.target.textContent.trim();
    if(c && v !== c.title){ c.title = v || t('newCol'); c.used = Date.now(); save(); render(); }
  }
});
document.addEventListener('keydown', e=>{
  if(e.target.matches('.col-title') && e.key==='Enter'){ e.preventDefault(); e.target.blur(); }
  if(e.key==='Escape'){ closeDialog(); $('#drawer').classList.remove('on'); }
});
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeDialog(); });
let rsT; window.addEventListener('resize', ()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ const a=document.activeElement; if(!(a && (a.matches('input,textarea,[contenteditable]')))) render(); },150); });


render();
let renderedFocusDay=focusDate();
function refreshFocusDay(){
 const day=focusDate();
 const active=document.activeElement;
 if(day!==renderedFocusDay && !(active&&active.matches('input,textarea,[contenteditable]'))){
  renderedFocusDay=day;focusExpanded=false;render();
 }
}
setInterval(refreshFocusDay,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshFocusDay();});
window.addEventListener('focus',refreshFocusDay);
window.__board = {get state(){return S;}};
})();
</script>
</body>
